// DIASHOW (2.5.0) – Videos laufen zu Ende, dann geht es weiter
// ═══════════════════════════════════════════════════════════════════
function toggleSlideshow(){ if(slideTimer!==null)stopSlideshow(); else startSlideshow(); }
function startSlideshow(){
  if(slideTimer!==null||lbPhotos.length<2)return;
  slideTimer=-1;                     // -1 = läuft, wartet auf das nächste Signal
  updateSlideshowButton();
  scheduleSlide();
}
function stopSlideshow(){
  if(slideTimer!==null&&slideTimer!==-1)clearTimeout(slideTimer);
  slideTimer=null;
  const v=document.getElementById('lb-video');
  if(v)v.onended=null;
  updateSlideshowButton();
}
function scheduleSlide(){
  if(slideTimer===null)return;
  if(slideTimer!==-1){clearTimeout(slideTimer);slideTimer=-1;}
  const p=lbPhotos[lbIndex];
  const v=document.getElementById('lb-video');
  if(p&&p.mimeType&&p.mimeType.startsWith('video/')&&v){
    v.onended=()=>{v.onended=null;advanceSlide();};
    return;
  }
  slideTimer=setTimeout(advanceSlide,SLIDE_MS);
}
function advanceSlide(){
  if(slideTimer===null||!lbPhotos.length)return;
  resetIdleTimer();   // eine laufende Diashow ist aktive Nutzung
  slideTimer=-1;
  lbIndex=(lbIndex+1)%lbPhotos.length;   // am Ende wieder von vorn
  renderLightbox();
}
function updateSlideshowButton(){
  const btn=document.getElementById('lb-slideshow');
  if(!btn)return;
  const on=slideTimer!==null;
  btn.textContent=on?'⏸':'▶';
  btn.classList.toggle('active',on);
  btn.title=on?t('slideshow.stop'):t('slideshow.start');
}

// ── UPLOAD ──────────────────────────────────────────────────────────
document.getElementById('file-input').addEventListener('dragover',e=>{e.preventDefault();});

// Cloudflare-Tunnel-sicher: kein einzelner Request überschreitet ~90 MB
// (Cloudflare Free lehnt Request-Bodies >100 MB mit 413 ab).
const UP_PART_SIZE=32*1024*1024;    // Teilgröße für große Dateien
const UP_REQ_BUDGET=90*1024*1024;   // Byte-Budget pro Einzel-Request

async function handleFiles(files){
  if(!files.length||!currentAlbumId)return;
  const albumId=currentAlbumId;
  const prog=document.getElementById('upload-progress');
  const bar=document.getElementById('progress-bar');
  const stat=document.getElementById('upload-status');
  if(!prog)return;
  prog.classList.add('visible');bar.style.width='2%';
  stat.textContent=t('upload.encrypting',files.length);
  const list=[...files];
  const totalBytes=list.reduce((s,f)=>s+f.size,0)||1;
  let doneBytes=0;
  const onBytes=n=>{
    doneBytes+=n;
    bar.style.width=Math.min(100,Math.max(2,Math.round(doneBytes/totalBytes*100)))+'%';
    resetIdleTimer();   // langer Upload soll nicht in den Auto-Logout laufen
  };
  // Kleine Dateien zu Batches bündeln, deren Gesamtgröße unter dem
  // Request-Budget bleibt (auch viele kleine Fotos zusammen konnten
  // bisher das 100-MB-Tunnel-Limit reißen); große Dateien einzeln in Teilen.
  const small=list.filter(f=>f.size<=UP_REQ_BUDGET);
  const large=list.filter(f=>f.size>UP_REQ_BUDGET);
  const batches=[];let cur=[],curSize=0;
  for(const f of small){
    if(cur.length&&(curSize+f.size>UP_REQ_BUDGET||cur.length>=50)){batches.push(cur);cur=[];curSize=0;}
    cur.push(f);curSize+=f.size;
  }
  if(cur.length)batches.push(cur);
  const uploaded=[],errors=[],dups=[];
  try{
    for(const batch of batches){
      const form=new FormData();
      for(const f of batch)form.append('photos',f);
      form.append('albumId',albumId);
      try{
        const r=await fetch('/api/photos/upload',{method:'POST',body:form});
        const data=await r.json().catch(()=>null);
        if(r.ok&&data){uploaded.push(...data.uploaded);errors.push(...data.errors);dups.push(...(data.duplicates||[]));}
        else errors.push(...batch.map(f=>f.name));
      }catch{errors.push(...batch.map(f=>f.name));}
      for(const f of batch)onBytes(f.size);
    }
    for(const f of large){
      try{
        const fin=await uploadChunked(f,albumId,onBytes);
        if(fin.uploaded&&fin.uploaded.length)uploaded.push(fin.uploaded[0]);
        if(fin.duplicates&&fin.duplicates.length)dups.push(...fin.duplicates);
      }
      catch(e){console.warn('Chunked upload failed:',f.name,e.message);errors.push(f.name);}
    }
    bar.style.width='100%';
    stat.textContent=t('upload.done',uploaded.length,errors.length)+(dups.length?` · ${t('upload.duplicates',dups.length)}`:'');
    if(uploaded.length)toast(t('upload.toast',uploaded.length)+(dups.length?` · ${t('upload.duplicates',dups.length)}`:''),'success');
    else if(dups.length)toast(t('upload.duplicates',dups.length),'');
    loadAlbums();
    setTimeout(()=>{prog.classList.remove('visible');bar.style.width='0';},4000);
    document.getElementById('file-input').value='';
  }catch{if(stat)stat.textContent=t('upload.fail');}
}

// Große Datei in Teilen hochladen: init → part×n (mit Retry) → finish.
// Bei Fehlern wird der serverseitige Zwischenstand per cancel aufgeräumt.
async function uploadChunked(file,albumId,onBytes){
  const partSize=UP_PART_SIZE,partCount=Math.ceil(file.size/partSize);
  const ir=await fetch('/api/photos/upload-init',{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({albumId,fileName:file.name,mimeType:file.type,size:file.size,partSize})});
  const init=await ir.json().catch(()=>({}));
  if(!ir.ok)throw new Error(init.error||'init failed');
  const uploadId=init.uploadId;
  try{
    for(let i=0;i<partCount;i++){
      const blob=file.slice(i*partSize,Math.min((i+1)*partSize,file.size));
      let ok=false,lastErr='';
      for(let attempt=0;attempt<3&&!ok;attempt++){   // wackliges Mobilnetz: bis zu 3 Versuche je Teil
        try{
          const fd=new FormData();
          fd.append('uploadId',uploadId);
          fd.append('index',String(i));
          fd.append('part',blob,'part');
          const pr=await fetch('/api/photos/upload-part',{method:'POST',body:fd});
          if(pr.ok)ok=true;
          else lastErr=((await pr.json().catch(()=>({}))).error)||('HTTP '+pr.status);
        }catch(e){lastErr=e.message;}
        if(!ok)await new Promise(r=>setTimeout(r,1500*(attempt+1)));
      }
      if(!ok)throw new Error(lastErr||'part failed');
      onBytes(blob.size);
    }
    const fr=await fetch('/api/photos/upload-finish',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({uploadId})});
    const fin=await fr.json().catch(()=>({}));
    if(!fr.ok)throw new Error(fin.error||'finish failed');
    return fin;   // enthält uploaded[] und duplicates[] (2.5.0)
  }catch(e){
    fetch('/api/photos/upload-cancel',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({uploadId})}).catch(()=>{});
    throw e;
  }
}

// ── THUMBS ──────────────────────────────────────────────────────────
async function loadThumb(id,idx){
  try{
    const r=await fetch(`/api/photos/${id}/thumb`);
    const ph=document.getElementById(`tp-${id}`);
    if(!r.ok){
      if(!ph)return;
      if(r.status===423){ // pending re-encryption by owner
        const pend=document.createElement('div');
        pend.className='thumb-pending';
        pend.innerHTML='<span class="tp-icon">🔒</span><span>'+t('photo.pending')+'</span>';
        ph.replaceWith(pend);
      } else if(r.status===401){
        const data=await r.json().catch(()=>({}));
        if(data.code==='DEK_MISSING'){toast(t('relogin.required'),'error');}
      }
      return;
    }
    const blob=await r.blob();
    const url=URL.createObjectURL(blob);
    lbThumbUrls[id]=url;
    if(!ph)return;
    const img=document.createElement('img');
    img.className='photo-thumb';
    img.src=url;
    img.alt='';
    img.draggable=false;
    ph.replaceWith(img);
    lbThumbCache[id]=url;
  }catch(e){console.warn('loadThumb error:',id,e);}
}

// ═══════════════════════════════════════════════════════════════════
// PDF-ANZEIGE (2.6.0) – pdf.js rendert jede Seite in ein eigenes Canvas
// ═══════════════════════════════════════════════════════════════════
// Bewusst dieselbe Anzeigetechnik wie bei Fotos: gerendertes Canvas statt
// des eingebauten PDF-Viewers des Browsers. Der hätte einen Download- und
// Druckknopf und würde den gesamten Speicherschutz aushebeln; auf iOS zeigt
// er in einem <iframe> zudem nur die erste Seite.
// Seiten werden erst gerendert, wenn sie in Sichtweite scrollen – ein
// 200-Seiten-Dokument darf den Raspberry nicht in die Knie zwingen.
let pdfLibPromise=null;      // dynamischer Import, erst beim ersten PDF
let pdfDoc=null;             // aktuell geöffnetes Dokument
let pdfToken=0;              // jüngster Ladevorgang gewinnt (vgl. photosLoadToken)
let pdfObserver=null;
let pdfZoomStep=0;
const PDF_ZOOMS=[1,1.5,2,3];   // 1 = an die Breite angepasst

function loadPdfLib(){
  if(!pdfLibPromise){
    pdfLibPromise=import('/vendor/pdfjs/build/pdf.min.mjs').then(lib=>{
      lib.GlobalWorkerOptions.workerSrc='/vendor/pdfjs/build/pdf.worker.min.mjs';
      return lib;
    }).catch(e=>{pdfLibPromise=null;throw e;});   // nächster Versuch darf neu laden
  }
  return pdfLibPromise;
}

// Aufräumen: laufende Renderaufträge verwerfen, Dokument freigeben, Container leeren.
// Wird bei JEDEM renderLightbox-Durchlauf aufgerufen, damit beim Wechsel auf ein
// Foto oder Video kein PDF im Hintergrund stehen bleibt.
function stopLbPdf(){
  pdfToken++;
  if(pdfObserver){pdfObserver.disconnect();pdfObserver=null;}
  const box=document.getElementById('lb-pdf');
  if(box){box.classList.remove('open');box.innerHTML='';}
  if(pdfDoc){try{pdfDoc.destroy();}catch{} pdfDoc=null;}
  ['lb-pdf-in','lb-pdf-out'].forEach(id=>{const b=document.getElementById(id);if(b)b.style.display='none';});
  const info=document.getElementById('lb-pdf-info');
  if(info)info.style.display='none';
}

async function renderPdf(p){
  const token=++pdfToken;
  pdfZoomStep=0;
  const box=document.getElementById('lb-pdf');
  if(!box)return;
  box.classList.add('open');
  box.innerHTML=`<div class="lb-pdf-note">${esc(t('pdf.loading'))}</div>`;
  try{
    const lib=await loadPdfLib();
    if(token!==pdfToken)return;
    const r=await fetch(`/api/photos/${p.id}/full`);
    if(!r.ok)throw new Error('HTTP '+r.status);
    const data=new Uint8Array(await r.arrayBuffer());
    if(token!==pdfToken)return;
    const doc=await lib.getDocument({
      data,
      standardFontDataUrl:'/vendor/pdfjs/standard_fonts/',
      wasmUrl:'/vendor/pdfjs/wasm/',
      iccUrl:'/vendor/pdfjs/iccs/',
      enableXfa:false,          // XFA-Formulare bewusst aus
      isEvalSupported:false     // kein Function()-Pfad für Font-Programme
    }).promise;
    if(token!==pdfToken){try{doc.destroy();}catch{} return;}
    pdfDoc=doc;
    buildPdfPages(token);
  }catch(e){
    if(token!==pdfToken)return;
    console.warn('PDF render failed:',e&&e.message);
    box.innerHTML=`<div class="lb-pdf-note">${esc(t('pdf.error'))}</div>`;
  }
}

// Breite einer Seite in CSS-Pixeln: an den Container angepasst, nach oben durch
// dieselbe Einstellung begrenzt wie Fotos (Galerie-Einstellungen), mal Zoomstufe.
function pdfPageWidth(box){
  const avail=Math.max(200,((box&&box.clientWidth)||window.innerWidth)-28);
  return Math.round(Math.min(avail,LB_PHOTO_PX())*PDF_ZOOMS[pdfZoomStep]);
}

// Platzhalter für alle Seiten anlegen und beobachten. Die Höhe ist zunächst
// geschätzt (A4-Verhältnis) und wird beim tatsächlichen Rendern korrigiert –
// so steht die Scrollleiste sofort und springt später nur geringfügig.
function buildPdfPages(token){
  const box=document.getElementById('lb-pdf');
  if(!box||!pdfDoc)return;
  box.innerHTML='';
  const n=pdfDoc.numPages;
  const info=document.getElementById('lb-pdf-info');
  if(info){info.textContent=t('pdf.pages',n);info.style.display='';}
  const zi=document.getElementById('lb-pdf-in'),zo=document.getElementById('lb-pdf-out');
  if(zi){zi.style.display='';zi.title=t('pdf.zoom_in');}
  if(zo){zo.style.display='';zo.title=t('pdf.zoom_out');}
  if(pdfObserver)pdfObserver.disconnect();
  pdfObserver=new IntersectionObserver(entries=>{
    for(const en of entries){
      if(!en.isIntersecting)continue;
      pdfObserver.unobserve(en.target);
      drawPdfPage(Number(en.target.dataset.page),en.target,token);
    }
  },{root:box,rootMargin:'400px 0px'});
  const w=pdfPageWidth(box);
  for(let i=1;i<=n;i++){
    const holder=document.createElement('div');
    holder.className='lb-pdf-page';
    holder.dataset.page=String(i);
    holder.style.width=w+'px';
    holder.style.height=Math.round(w*1.414)+'px';
    box.appendChild(holder);
    pdfObserver.observe(holder);
  }
}

async function drawPdfPage(num,holder,token){
  if(token!==pdfToken||!pdfDoc)return;
  try{
    const page=await pdfDoc.getPage(num);
    if(token!==pdfToken)return;
    const base=page.getViewport({scale:1});
    const cssW=parseFloat(holder.style.width)||pdfPageWidth(document.getElementById('lb-pdf'));
    const dpr=Math.min(window.devicePixelRatio||1,2);   // gedeckelt: Speicher auf Handys
    const vp=page.getViewport({scale:(cssW/base.width)*dpr});
    const canvas=document.createElement('canvas');
    canvas.width=Math.round(vp.width);
    canvas.height=Math.round(vp.height);
    await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
    if(token!==pdfToken)return;
    // Wasserzeichen wie bei Fotos – Sichtschutz, kein Krypto
    if(me&&me.username&&window.addWatermark)window.addWatermark(canvas,me.username);
    holder.style.height='';
    holder.replaceChildren(canvas);
    try{page.cleanup();}catch{}
  }catch(e){
    if(token!==pdfToken)return;
    holder.style.height='';
    holder.style.padding='20px';
    holder.style.color='var(--muted)';
    holder.textContent=t('pdf.page_error',num);
  }
}

// Zoom: baut die Seiten in der neuen Breite neu auf. Die Token-Erhöhung bricht
// noch laufende Renderaufträge der alten Stufe ab.
function pdfZoom(dir){
  const next=Math.max(0,Math.min(PDF_ZOOMS.length-1,pdfZoomStep+dir));
  if(next===pdfZoomStep||!pdfDoc)return;
  pdfZoomStep=next;
  buildPdfPages(++pdfToken);
}

// Anzeige-Limits der Lightbox (längste Kante in CSS-Pixeln, Aspect Ratio
// bleibt immer erhalten). Video-Limit wird zusätzlich im Inline-Style des
// <video id="lb-video">-Elements gespiegelt (800px).
// Ab 1.11.0 admin-konfigurierbar (Galerie-Einstellungen); Fallback = alte Konstanten.
function LB_PHOTO_PX(){return appSettings.lbMaxPhotoPx||1200;}
function LB_VIDEO_PX(){return appSettings.lbMaxVideoPx||800;}
// 2.7.0: eigene Grenze für animierte GIFs (Default 200 px). Sie sind meist
// klein und wirken formatfüllend hochskaliert unruhig.
function LB_GIF_PX(){return appSettings.lbMaxGifPx||200;}

// ═══ ANIMIERTE GIFs (2.7.0) ═══════════════════════════════════════
// Ein GIF läuft nur in einem <img>. Der Canvas-Weg der Fotos würde ein
// Standbild zeigen (drawImage kopiert genau einen Frame), und ein manuelles
// Frame-Rendering setzte den ImageDecoder voraus, den ältere Safari- und
// Firefox-Fassungen nicht haben. Die Bytes kommen wie bei jedem Foto über
// /full und werden als Blob-URL gesetzt – nichts liegt unverschlüsselt auf
// der Platte, und das Speicherschutz-Overlay bleibt aktiv.
// Ehrlich benannte Grenze: Der Schutz ist derselbe wie bei Fotos, also
// Sichtschutz. Wer eine Animation sehen kann, kann sie aufnehmen.
var gifToken=0;   // bricht spät ankommende Ladevorgänge ab (Muster aus 1.1.2)

function stopLbGif(){
  gifToken++;
  const wrap=document.getElementById('lb-gif-wrap');
  const img=document.getElementById('lb-gif');
  if(img){
    if(img._url){URL.revokeObjectURL(img._url);img._url=null;}
    img.removeAttribute('src');
    img.style.width='';img.style.height='';
  }
  if(wrap)wrap.classList.remove('open');
  const wm=document.getElementById('lb-gif-wm');
  if(wm)wm.style.backgroundImage='';
}

// Wasserzeichen für die GIF-Anzeige. Bei Fotos wird es ins Canvas gezeichnet;
// hier entsteht dieselbe Kachel einmalig als Bild und liegt als
// CSS-Hintergrund über der Animation. Bedingung identisch zu addWatermark:
// nur wenn der Benutzer das Wasserzeichen eingeschaltet hat.
function gifWatermarkTile(username){
  if(localStorage.getItem('vermeer_wm')!=='1')return '';
  const c=document.createElement('canvas');c.width=300;c.height=150;
  const ctx=c.getContext('2d');
  ctx.globalAlpha=0.06;ctx.fillStyle='#ffffff';
  ctx.font='14px DM Sans, sans-serif';
  ctx.translate(150,75);ctx.rotate(-Math.PI/6);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(`${appSettings.galleryName||'Vermeer'} · ${username}`,0,0);
  try{return c.toDataURL('image/png');}catch{return '';}
}

// Anzeigegröße eines GIFs: längste Kante auf `lim` begrenzt, Seitenverhältnis
// erhalten. Bewusst NIE hochskalieren (Faktor max. 1) – ein 80-px-GIF auf
// 200 px aufgeblasen wird nur unscharf, gerade bei Pixelgrafik. Der Viewport
// bleibt die engere Grenze (40 px seitlich, 140 px für Kopfzeile und
// Filmstreifen). Ausgelagert, damit die Arithmetik testbar bleibt.
function gifDisplaySize(nw,nh,lim,vw,vh){
  const availW=Math.min(vw-40,lim);
  const availH=Math.min(vh-140,lim);
  const scale=Math.min(availW/nw,availH/nh,1);
  return {w:Math.max(1,Math.round(nw*scale)),h:Math.max(1,Math.round(nh*scale))};
}

function renderGif(p){
  const token=++gifToken;
  const wrap=document.getElementById('lb-gif-wrap');
  const img=document.getElementById('lb-gif');
  if(!wrap||!img)return;
  wrap.classList.add('open');
  fetch(`/api/photos/${p.id}/full`).then(r=>r.ok?r.blob():null).then(b=>{
    if(!b||token!==gifToken)return;
    const url=URL.createObjectURL(b);
    img._url=url;
    img.onload=()=>{
      if(token!==gifToken){URL.revokeObjectURL(url);return;}
      const lim=LB_GIF_PX();
      const nw=img.naturalWidth||lim, nh=img.naturalHeight||lim;
      const box=gifDisplaySize(nw,nh,lim,window.innerWidth,window.innerHeight);
      img.style.width=box.w+'px';
      img.style.height=box.h+'px';
      const wm=document.getElementById('lb-gif-wm');
      if(wm){
        const tile=(me&&me.username)?gifWatermarkTile(me.username):'';
        wm.style.backgroundImage=tile?`url(${tile})`:'';
      }
    };
    img.src=url;
  }).catch(()=>{});
}
function renderLightbox(){
  const p=lbPhotos[lbIndex];if(!p)return;
  // View exakt einmal pro Öffnung zählen (Server dedupliziert zusätzlich 10 Min)
  fetch(`/api/photos/${p.id}/view`,{method:'POST'}).catch(()=>{});
  updateFavButton();
  updateSlideshowButton();
  document.getElementById('lb-title').textContent=(me&&me.type==='observer')?'':p.originalName;
  document.getElementById('lb-counter').textContent=`${lbIndex+1} / ${lbPhotos.length}`;
  document.getElementById('lb-prev').disabled=lbIndex===0;
  document.getElementById('lb-next').disabled=lbIndex===lbPhotos.length-1;

  // Canvas-based rendering: prevents "Save image as" from getting a usable URL
  const canvas=document.getElementById('lightbox-img');
  const vid=document.getElementById('lb-video');
  const ov=document.getElementById('lb-img-overlay');
  // 2.6.0: ein evtl. offenes PDF IMMER zuerst abräumen (Dokument freigeben,
  // laufende Renderaufträge verwerfen) – sonst bliebe es beim Wechsel auf ein
  // Foto oder Video über der Anzeige stehen.
  stopLbPdf();
  // 2.7.0: dasselbe für ein evtl. offenes GIF – Blob freigeben, Ladevorgang
  // per Token verwerfen, Wrapper schließen.
  stopLbGif();
  // ── PDF-Dokument (2.6.0) ──
  if(p.isPdf||p.mimeType==='application/pdf'){
    canvas.style.display='none';
    if(vid){vid.pause();vid.style.display='none';if(vid._url){URL.revokeObjectURL(vid._url);vid._url=null;}vid.src='';}
    // Overlay ausblenden: es würde Scrollen, Zoomen und Antippen schlucken –
    // exakt der Fehler, der bei Videos in 1.10.3 behoben wurde.
    // Schutz bleibt: Canvas-Rendering und der globale contextmenu-Block.
    if(ov)ov.style.display='none';
    renderPdf(p);
    scheduleSlide();   // Diashow behandelt ein PDF wie ein Foto (feste Dauer)
    return;
  }
  // ── Animiertes GIF (2.7.0) ──
  if(p.isGif||p.mimeType==='image/gif'){
    canvas.style.display='none';
    if(vid){vid.pause();vid.style.display='none';if(vid._url){URL.revokeObjectURL(vid._url);vid._url=null;}vid.src='';}
    // Overlay bleibt AKTIV (anders als bei Video und PDF): Am GIF gibt es
    // nichts zu bedienen, es verhält sich wie ein Foto – Klick schließt,
    // Wisch blättert, Rechtsklick ist geblockt.
    if(ov)ov.style.display='';
    renderGif(p);
    scheduleSlide();   // Diashow: feste Dauer wie bei einem Foto
    return;
  }
  // ── Video-Wiedergabe ──
  if(p.mimeType&&p.mimeType.startsWith('video/')){
    canvas.style.display='none';
    // Overlay ausblenden: es würde alle Touches/Klicks schlucken (closeLightbox)
    // und die nativen Video-Controls (Spulen, Pause) unbedienbar machen.
    // Schutz bleibt: globaler contextmenu-Block in #lightbox + controlsList="nodownload".
    if(ov)ov.style.display='none';
    vid.style.display='block';
    // Längste Kante auf LB_MAX_VIDEO_PX begrenzen; das <video>-Element
    // erhält das Aspect Ratio innerhalb der max-Grenzen selbst
    vid.style.maxWidth=`min(100%,${LB_VIDEO_PX()}px)`;
    vid.style.maxHeight=`min(calc(100vh - 100px),${LB_VIDEO_PX()}px)`;
    if(vid._url){URL.revokeObjectURL(vid._url);vid._url=null;}
    if(p.streamable){
      // Echtes Streaming: Browser holt sich Byte-Ranges selbst (sofortiger Start, Spulen)
      vid.src=`/api/photos/${p.id}/stream`;
      vid.play().catch(()=>{});
    } else {
      // Fallback für Bestandsvideos (v1.6, Ganzdatei) – wird beim nächsten
      // Login des Besitzers automatisch auf das Streaming-Format migriert
      vid.src='';
      fetch(`/api/photos/${p.id}/full`).then(r=>r.ok?r.blob():null).then(b=>{
        if(!b)return;
        vid._url=URL.createObjectURL(b);
        vid.src=vid._url;
        vid.play().catch(()=>{});
      }).catch(()=>{});
    }
    scheduleSlide();   // Diashow: nach dem Videoende weiterschalten
    return;
  }
  // ── Foto: Video stoppen und verstecken, Overlay wieder aktivieren ──
  if(vid){vid.pause();vid.style.display='none';if(vid._url){URL.revokeObjectURL(vid._url);vid._url=null;}vid.src='';}
  if(ov)ov.style.display='';
  canvas.style.display='block';
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);

  function drawOnCanvas(blobUrl){
    const tmpImg=new Image();
    tmpImg.onload=()=>{
      // Size canvas to fit viewport, aber maximal LB_MAX_PHOTO_PX auf der
      // längsten Kante (Aspect Ratio bleibt durch den min-Scale erhalten)
      const maxW=Math.min(window.innerWidth,LB_PHOTO_PX());
      const maxH=Math.min(window.innerHeight-90,LB_PHOTO_PX());   // Filmstreifen unten
      const scale=Math.min(maxW/tmpImg.width,maxH/tmpImg.height);   // auch hochskalieren (bis max. Limit)
      canvas.width=tmpImg.width*scale;
      canvas.height=tmpImg.height*scale;
      ctx.drawImage(tmpImg,0,0,canvas.width,canvas.height);
      // Subtle watermark with username
      if(me&&me.username) window.addWatermark(canvas,me.username);
      URL.revokeObjectURL(blobUrl); // free memory immediately
    };
    tmpImg.src=blobUrl;
  }

  if(lbThumbUrls[p.id]){
    // Re-fetch so we get a fresh blob (cached URL was revoked)
    fetch(`/api/photos/${p.id}/thumb`).then(r=>r.blob()).then(b=>drawOnCanvas(URL.createObjectURL(b))).catch(()=>{});
    fetch(`/api/photos/${p.id}/full`).then(r=>r.ok?r.blob():null).then(b=>{if(b)drawOnCanvas(URL.createObjectURL(b));}).catch(()=>{});
  } else {
    fetch(`/api/photos/${p.id}/thumb`).then(r=>r.blob()).then(b=>{
      const url=URL.createObjectURL(b);lbThumbUrls[p.id]=url;drawOnCanvas(URL.createObjectURL(b));
      fetch(`/api/photos/${p.id}/full`).then(r=>r.ok?r.blob():null).then(fb=>{if(fb)drawOnCanvas(URL.createObjectURL(fb));}).catch(()=>{});
    }).catch(()=>{});
  }
  // Highlight active strip thumb
  document.querySelectorAll('.lb-strip-thumb').forEach((el,i)=>{
    el.classList.toggle('active',i===lbIndex);
  });
  // Scroll strip to active
  const strip=document.getElementById('lb-strip');
  const active=strip.children[lbIndex];
  if(active)active.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
  scheduleSlide();
}

function buildStrip(){
  const strip=document.getElementById('lb-strip');strip.innerHTML='';
  lbPhotos.forEach((p,i)=>{
    const img=document.createElement('img');img.className='lb-strip-thumb';
    img.alt='';img.loading='lazy';
    if(lbThumbUrls[p.id])img.src=lbThumbUrls[p.id];
    else img.src='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'; // transparent placeholder
    img.addEventListener('click',()=>{lbIndex=i;renderLightbox();});
    img.classList.toggle('active',i===lbIndex);
    strip.appendChild(img);
    // Lazy load strip thumbs
    if(!lbThumbUrls[p.id]){
      fetch(`/api/photos/${p.id}/thumb`).then(r=>r.blob()).then(b=>{
        const url=URL.createObjectURL(b);lbThumbUrls[p.id]=url;img.src=url;
        // Also update main if this is current
        if(lbIndex===i)document.getElementById('lightbox-img').src=url;
      }).catch(()=>{});
    }
  });
}

function lbNavigate(dir){
  lbIndex=Math.max(0,Math.min(lbPhotos.length-1,lbIndex+dir));
  renderLightbox();
}

function stopLbVideo(){const v=document.getElementById('lb-video');if(v){v.pause();if(v._url){URL.revokeObjectURL(v._url);v._url=null;}v.src='';v.style.display='none';}}
function closeLightbox(){
  stopSlideshow();
  stopLbVideo();
  stopLbPdf();
  stopLbGif();
  document.getElementById('lightbox').classList.remove('open');
  const canvas=document.getElementById('lightbox-img');
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
}

// Keyboard navigation
document.addEventListener('keydown',e=>{
  const lb=document.getElementById('lightbox');
  if(!lb.classList.contains('open'))return;
  // Bei sichtbarem Video: Pfeiltasten dem nativen Spulen überlassen.
  // Bei offenem PDF (2.6.0): dem Scrollen im Dokument überlassen.
  const v=document.getElementById('lb-video');
  const pdfBox=document.getElementById('lb-pdf');
  const videoActive=(v&&v.style.display!=='none')||(pdfBox&&pdfBox.classList.contains('open'));
  if(!videoActive&&(e.key==='ArrowRight'||e.key==='ArrowDown'))lbNavigate(1);
  else if(!videoActive&&(e.key==='ArrowLeft'||e.key==='ArrowUp'))lbNavigate(-1);
  else if(e.key==='Escape')closeLightbox();
});

// Click outside image to close
document.getElementById('lightbox').addEventListener('click',e=>{if(e.target===e.currentTarget)closeLightbox();});
document.getElementById('lb-img-overlay').addEventListener('click',()=>closeLightbox());

// ── Touch / Swipe support ──────────────────────────────────────────
(function(){
  const lb=document.getElementById('lightbox');
  let touchStartX=0,touchStartY=0,touchStartTime=0;

  lb.addEventListener('touchstart',e=>{
    if(e.touches.length!==1)return;
    touchStartX=e.touches[0].clientX;
    touchStartY=e.touches[0].clientY;
    touchStartTime=Date.now();
  },{passive:true});

  lb.addEventListener('touchend',e=>{
    if(e.changedTouches.length!==1)return;
    const dx=e.changedTouches[0].clientX-touchStartX;
    const dy=e.changedTouches[0].clientY-touchStartY;
    const dt=Date.now()-touchStartTime;
    const absDx=Math.abs(dx),absDy=Math.abs(dy);
    const target=e.changedTouches[0].target;

    // Touches auf dem Video gehören den nativen Controls (Scrubbing/Play):
    // weder Swipe-Navigation noch Schließen auslösen.
    // Dasselbe für das PDF (2.6.0): dort wird gescrollt und gezoomt, ein
    // horizontaler Wisch darf nicht zum nächsten Foto springen.
    if(target&&target.closest&&(target.closest('#lb-video')||target.closest('#lb-pdf')))return;

    // Must be fast enough (<400ms), horizontal enough (2x more than vertical)
    // and long enough (>40px) to count as a swipe
    if(dt<400&&absDx>40&&absDx>absDy*1.5){
      if(dx<0)lbNavigate(1);   // swipe left  → next
      else    lbNavigate(-1);  // swipe right → prev
    }
    // Short tap on background (not on image/controls) → close
    else if(dt<200&&absDx<10&&absDy<10){
      if(target===lb||target.id==='lb-img-overlay')closeLightbox();
    }
  },{passive:true});
})();

// ── Album verschieben (2.8.0) ──
// Ziele: Alben desselben Besitzers, die ich verwalten darf, außer dem Album
// selbst und seinen Unteralben. Gesperrte Quelle/Ziel werden im Dialog per
// PIN geöffnet und danach wieder gesperrt (außer dem gerade geöffneten Album).
let amoveAlbum=null,amoveTarget=undefined,amoveConfirmAccess=false;
function amoveSubtree(id){const out=new Set([id]);let grew=true;
  while(grew){grew=false;allAlbums.forEach(a=>{if(a.parentId&&out.has(a.parentId)&&!out.has(a.id)){out.add(a.id);grew=true;}});}
  return out;}
function amoveRootOf(a){return a&&a.effectiveHidden?(a.hiddenRootId||a.id):null;}
function openAlbumMoveModal(album){
  amoveAlbum=album;amoveTarget=undefined;amoveConfirmAccess=false;
  document.getElementById('amove-title').textContent=t('amove.title',album.name);
  document.getElementById('amove-pw').value='';
  document.querySelector('input[name="amove-lock"][value="keep"]').checked=true;
  document.getElementById('amove-pw-group').style.display='none';
  const sub=amoveSubtree(album.id);
  const cands=allAlbums.filter(a=>!sub.has(a.id)&&a.id!=='__shared__'&&a.canManage&&a.ownerId===album.ownerId);
  const candIds=new Set(cands.map(a=>a.id));
  const row=(id,label,depth,extra)=>`<label class="perm-album-item" style="padding-left:${8+depth*16}px">
      <input type="radio" name="amove-target" value="${id}"${(album.parentId||'')===id?' disabled':''}>
      <span>${label}</span>${extra?`<span style="color:var(--muted);font-size:11px;margin-left:6px">${extra}</span>`:''}</label>`;
  const walk=(list,depth)=>list.sort((x,y)=>x.name.localeCompare(y.name)).map(a=>
    row(a.id,`${a.locked?'🔒 ':(a.effectiveHidden?'🕶 ':'')}${esc(a.name)}`,depth,(album.parentId===a.id)?t('amove.current'):'')
    +walk(cands.filter(c=>c.parentId===a.id),depth+1)).join('');
  // Kandidaten, deren Elternalbum kein Kandidat ist, erscheinen auf oberster Ebene
  const tops=cands.filter(a=>!a.parentId||!candIds.has(a.parentId));
  document.getElementById('amove-tree').innerHTML=row('',`⌂ ${esc(t('amove.root'))}`,0,album.parentId?'':t('amove.current'))+walk(tops,1);
  document.querySelectorAll('input[name="amove-target"]').forEach(r=>r.addEventListener('change',e=>{
    amoveTarget=e.target.value||null;amoveConfirmAccess=false;amoveRefresh();}));
  amoveRefresh();
  document.getElementById('modal-album-move').classList.add('open');
}
function amoveRefresh(){
  const album=amoveAlbum,btn=document.getElementById('amove-confirm-btn');
  document.getElementById('amove-err').style.display='none';
  const acc=document.getElementById('amove-access');
  if(!amoveConfirmAccess){acc.style.display='none';acc.innerHTML='';}
  btn.textContent=amoveConfirmAccess?t('amove.confirm_access'):t('amove.confirm');
  btn.disabled=amoveTarget===undefined;
  const target=amoveTarget?allAlbums.find(a=>a.id===amoveTarget):null;
  // PIN-Felder für gesperrte Quelle bzw. gesperrtes Ziel (je Sperr-Album nur einmal)
  const need=[];
  [album,target].forEach(a=>{if(a&&a.locked){const r=amoveRootOf(a);if(!need.includes(r))need.push(r);}});
  const pins=document.getElementById('amove-pins');
  const keep={};pins.querySelectorAll('input[data-root]').forEach(i=>keep[i.dataset.root]=i.value);
  pins.innerHTML=need.map(r=>{const ra=allAlbums.find(x=>x.id===r);
    return `<div class="form-group" style="margin-top:12px"><label>${esc(t('amove.pin_label',ra?ra.name:'?'))}</label>
      <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" class="pin-input" data-root="${r}" placeholder="••••" autocomplete="off"></div>`;}).join('');
  pins.querySelectorAll('input[data-root]').forEach(i=>{if(keep[i.dataset.root])i.value=keep[i.dataset.root];});
  // B1: Ziel liegt in einem versteckten Bereich → dessen PIN gilt
  const nested=document.getElementById('amove-nested');
  const tRoot=amoveRootOf(target);
  if(amoveTarget!==undefined&&tRoot){
    const ra=allAlbums.find(x=>x.id===tRoot);
    nested.textContent=t('amove.nested',ra?ra.name:'?')+(album.hidden?' '+t('amove.nested_own'):'');
    nested.style.display='block';
  } else nested.style.display='none';
  // C1/C2: Album verliert durch den Umzug seinen geerbten Sichtschutz
  const losesLock=amoveTarget!==undefined&&album.effectiveHidden&&!album.hidden&&!tRoot;
  document.getElementById('amove-lock').style.display=losesLock?'block':'none';
}
document.querySelectorAll('input[name="amove-lock"]').forEach(r=>r.addEventListener('change',()=>{
  document.getElementById('amove-pw-group').style.display=
    document.querySelector('input[name="amove-lock"]:checked').value==='remove'?'block':'none';
  amoveConfirmAccess=false;amoveRefresh();   // mit/ohne Sperre sehen ggf. andere Personen das Album
}));
let amoveUnlocked=[];
async function closeAlbumMoveModal(moved){
  closeModal('modal-album-move');
  // Im Dialog geöffnete Sperren wieder schließen – außer der, in der ich mich
  // gerade befinde. Nach einem Umzug zählt dafür die frische Albenliste (nur
  // die Daten, noch ohne Neuzeichnen). Erst danach wird gerendert: parallele
  // Anfragen (Cover, Fotos) schreiben beim Datei-Store per "touch" den alten
  // Sitzungsstand zurück und könnten eine gerade gesetzte Sperre aufheben.
  if(moved){try{allAlbums=await (await fetch('/api/albums')).json();}catch{}}
  const cur=currentAlbumId?allAlbums.find(a=>a.id===currentAlbumId):null;
  const curRoot=amoveRootOf(cur);
  const toRelock=amoveUnlocked.filter(r=>r!==curRoot);amoveUnlocked=[];
  for(const r of toRelock){try{await (await fetch(`/api/albums/${r}/relock`,{method:'POST'})).text();}catch{}}
  if(moved||toRelock.length)await loadAlbums();
}
async function doAlbumMove(){
  if(!amoveAlbum||amoveTarget===undefined)return;
  const errEl=document.getElementById('amove-err');errEl.style.display='none';
  const fail=msg=>{errEl.textContent=msg;errEl.style.display='block';};
  // 1. Gesperrte Quelle/Ziel per PIN öffnen
  for(const i of document.querySelectorAll('#amove-pins input[data-root]')){
    const r=i.dataset.root;if(amoveUnlocked.includes(r))continue;
    if(!/^\d{4}$/.test(i.value))return fail(t('amove.pin_missing'));
    const ur=await api('POST',`/api/albums/${r}/unlock`,{pin:i.value});
    // Antwort vollständig lesen: express-session hält das letzte Byte zurück, bis
    // die Sitzung gespeichert ist – sonst sähe der folgende Request die Entsperrung nicht.
    const d=await ur.json().catch(()=>({}));
    if(!ur.ok)return fail(d.error==='Wrong PIN'?t('pin.wrong'):(d.error||t('error')));
    amoveUnlocked.push(r);
  }
  // 2. Sperr-Entscheidung (C1/C2)
  const body={parentId:amoveTarget,confirm:amoveConfirmAccess};
  if(document.getElementById('amove-lock').style.display!=='none'){
    body.lock=document.querySelector('input[name="amove-lock"]:checked').value;
    if(body.lock==='remove'){body.password=document.getElementById('amove-pw').value;if(!body.password)return fail(t('amove.pw_missing'));}
  }
  const r=await api('PUT',`/api/albums/${amoveAlbum.id}/parent`,body);
  const data=await r.json().catch(()=>({}));
  if(r.status===409&&data.code==='CONFIRM_ACCESS'){
    // 3. D1: Freigabe-Änderung anzeigen und ausdrücklich bestätigen lassen
    const acc=document.getElementById('amove-access');
    acc.innerHTML=`<p style="margin-bottom:6px">${esc(t('amove.access_title'))}</p>`
      +(data.gained.length?`<p>➕ ${esc(t('amove.access_gained',data.gained.join(', ')))}</p>`:'')
      +(data.lost.length?`<p>➖ ${esc(t('amove.access_lost',data.lost.join(', ')))}</p>`:'')
      +`<p style="margin-top:6px;color:var(--muted)">${esc(t('amove.access_note'))}</p>`;
    acc.style.display='block';amoveConfirmAccess=true;
    document.getElementById('amove-confirm-btn').textContent=t('amove.confirm_access');
    return;
  }
  if(!r.ok){
    if(data.code==='PASSWORD')return fail(t('amove.pw_wrong'));
    if(data.code==='LOCKED')return fail(t('album.locked_toast'));
    return fail(data.error||t('error'));
  }
  let msg=data.lockKept?t('amove.done_lock'):t('amove.done');
  if(data.unlinked)msg+=' · '+t('amove.unlinked',data.unlinked);
  toast(msg,'success');
  if(data.lockKept)amoveUnlocked.push(amoveAlbum.id);   // mitgenommene Sperre ist nur für diesen Vorgang offen
  amoveAlbum=null;
  await closeAlbumMoveModal(true);
}

function api(method,url,body){return fetch(url,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});}

function toast(msg,type=''){const el=document.getElementById('toast');el.textContent=msg;el.className=`show ${type}`;clearTimeout(toast._t);toast._t=setTimeout(()=>el.className='',3000);}
// Toast mit Aktionsknopf (2.5.0) – steht länger, weil man ihn lesen und

function toastUndo(msg,fn,ms=10000){
  const el=document.getElementById('toast');
  el.textContent=msg;
  const b=document.createElement('button');
  b.className='toast-undo';b.textContent=t('undo.btn');

  clearTimeout(toast._t);

}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/`/g,'&#96;');}
function fmtDateTime(ts){if(!ts)return'';const d=new Date(ts);return d.toLocaleDateString()+' '+d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});}

// DOWNLOAD PROTECTION
// ═══════════════════════════════════════════════════════════════════
(function() {

  // 1. Block right-click context menu on photo elements
  document.addEventListener('contextmenu', e => {
    const isProtected =
      e.target.closest('#lightbox') ||
      e.target.closest('.photo-img-wrap') ||
      e.target.closest('.lb-strip') ||
      e.target.classList.contains('photo-thumb') ||
      e.target.classList.contains('lb-strip-thumb') ||
      e.target.id === 'lightbox-img';
    if (isProtected) {
      e.preventDefault();
      return false;
    }
  });

  // 2. Block drag-and-drop of images (another way to extract)
  document.addEventListener('dragstart', e => {
    if (e.target.tagName === 'IMG') {
      e.preventDefault();
      return false;
    }
  });

  // 3. Block common keyboard shortcuts for saving
  document.addEventListener('keydown', e => {
    const lb = document.getElementById('lightbox');
    if (!lb || !lb.classList.contains('open')) return;
    const key = e.key.toLowerCase();
    // Block Ctrl/Cmd + S (save), Ctrl/Cmd + Shift + S, PrintScreen
    if ((e.ctrlKey || e.metaKey) && (key === 's' || key === 'u')) {
      e.preventDefault(); return false;
    }
    if (e.key === 'PrintScreen') {
      e.preventDefault(); return false;
    }
  }, true); // capture phase

  // 4. Render lightbox image on Canvas instead of <img> src
  // This prevents "Save image as" from getting the real URL
  // and makes the image non-draggable at the pixel level
  window.renderImageOnCanvas = function(blobUrl, canvasId) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const img = new Image();
    img.onload = () => {
      // Fit inside canvas maintaining aspect ratio
      const maxW = canvas.clientWidth  || canvas.width;
      const maxH = canvas.clientHeight || canvas.height;
      const scale = Math.min(maxW / img.width, maxH / img.height, 1);
      canvas.width  = img.width  * scale;
      canvas.height = img.height * scale;
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(blobUrl); // immediately free the blob URL
    };
    img.src = blobUrl;
  };

  // 5. Watermark canvas overlay (optional subtle protection)
  window.addWatermark = function(canvas, username) {
    const ctx = canvas.getContext('2d');
    ctx.save();
    ctx.globalAlpha = 0.06;
    ctx.fillStyle = '#ffffff';
    ctx.font = `${Math.max(14, canvas.width * 0.02)}px DM Sans, sans-serif`;
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.rotate(-Math.PI / 6);
    if(localStorage.getItem('vermeer_wm')!=='1')return;   // Wasserzeichen standardmäßig aus
    const text = `${appSettings.galleryName||'Vermeer'} · ${username}`;
    const cols = Math.ceil(canvas.width  / 300) + 2;
    const rows = Math.ceil(canvas.height / 150) + 2;
    for (let r = -rows; r <= rows; r++) {
      for (let c = -cols; c <= cols; c++) {
        ctx.fillText(text, c * 300 - 150, r * 150);
      }
    }
    ctx.restore();
  };

})();
